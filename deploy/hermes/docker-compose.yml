# Hermes Agent + astra（NAS 部署）
# 落点：<部署根>/hermes/docker-compose.yml，同目录放 .env（只放 compose 变量，见 compose.env.example）
#
# - 飞书走 WebSocket 长连接，只有出站连接，不发布任何宿主端口
# - 模型走同机的 WorkBuddy2API（OpenAI 兼容），通过 workbuddy2api_default 网络按容器名直连
# - astra 单文件 CLI 与 skill 只读挂进来；astra 的状态目录、音乐目录单独挂载
# - 模型 key、飞书密钥都在 data/.env（Hermes 自己的配置），这里不写明文
services:
  hermes:
    # 官方镜像 + 飞书 SDK（见同目录 Dockerfile）。首次/更新依赖时：docker compose build
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-feishu:${HERMES_TAG:-latest}
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      - TZ=Asia/Shanghai
      # 容器内 hermes 用户映射成这个 UID/GID；要对 data、astra/home、音乐目录有写权限
      - HERMES_UID=${HERMES_UID:?在 .env 里设 HERMES_UID}
      - HERMES_GID=${HERMES_GID:?在 .env 里设 HERMES_GID}
      # dashboard 的开关必须是容器环境变量：镜像里的 s6 run 脚本只看进程环境，不读 data/.env
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - ASTRA_HOME=/opt/astra/home
      # Hermes 默认只允许写 /opt/data（HERMES_WRITE_SAFE_ROOT 在镜像里设成这个值）。
      # 要让它能改 skill 文档，把 skills 目录也加进来。多个路径用 os.pathsep 分隔，
      # Linux 下是冒号。**注意这不是 config.yaml 里的键，是环境变量，写配置里不生效。**
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/opt/astra/skills
      - ASTRA_MUSIC_DIR=/music
    ports:
      # Web 面板；只在内网。非回环绑定强制要账号密码（见 data/.env）
      - "9119:9119"
    # 让 agent 能操作宿主 Docker（等价于宿主机 root 权限，见 deploy/README 的安全说明）
    group_add:
      - "121"   # NAS 上 docker.sock 的属组
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主文件访问范围：home 和 volume1，可读写（与 Kura 的 WebDAV 暴露范围一致）。
      # 危险：agent 能改/删这两个目录下的任何文件。
      - /home:/host-root/home
      - /volume1:/host-root/volume1
      - ${DEPLOY_ROOT:?}/hermes/data:/opt/data
      - ${DEPLOY_ROOT}/astra/bin:/opt/astra/bin:ro
      # skills 放开为可写：Hermes 要能更新技能文档（agent 自己维护它）。
      # 只放这一个目录 —— 里面只有 .md，不碰代码和数据。
      - ${DEPLOY_ROOT}/astra/skills:/opt/astra/skills
      - ${DEPLOY_ROOT}/astra/home:/opt/astra/home
      # astra 包装脚本放进 Hermes 默认 PATH 里的 ~/.local/bin（PATH 不能经 .env 改）
      - ${DEPLOY_ROOT}/astra/bin/astra:/opt/data/.local/bin/astra:ro
      - ${MUSIC_DIR:?}:/music
    networks:
      - workbuddy2api_default
      # Kura 的服务映射按容器名解析，kura-server 在 sso-net 上
      - sso-net
    labels:
      # 镜像升级可能带 SQLite / 配置迁移，不要无人在场时自动升级
      - com.centurylinklabs.watchtower.enable=false

networks:
  workbuddy2api_default:
    external: true
  sso-net:
    external: true
