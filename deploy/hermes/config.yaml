# <部署根>/hermes/data/config.yaml 的初始内容。
# Hermes 首次启动会补全其余默认项；这里只写和 astra / 模型相关的部分。
# 字段依据 hermes-agent 仓库 cli-config.yaml.example（2026-10-21 main）。
model:
  # 同机 WorkBuddy2API；key 走 .env 的 OPENAI_API_KEY
  provider: "custom"
  base_url: "http://workbuddy2api:7863/v1"
  # 2026-10-21 实测：deepseek-v4-pro / glm-5.3 / kimi-k3-1 / minimax-m3 等都能正确调 terminal 并遵守"歧义时先问"。
  # 换模型：飞书里发 /model，或改这里
  default: "cn:glm-5.3-flash"
  # glm-5.3-flash 是快模型，思考档位压到 low：响应快、省 token
  reasoning_effort: "low"
  # 换模型时若上下文超过这个数会先警告（飞书里回 /approve 或 /cancel）；0 关掉。
  # 实测这个键从 model 段读，不是独立的 model_switch_guard 段。
  # 留着是好事：换模型会让 prompt cache 整份失效，提醒一下值得
  switch_context_confirm_tokens: 400000

terminal:
  backend: local
  # 单曲 FLAC 下载 + 写标签可能要几十秒；歌单走后台任务，不靠这个等
  timeout: 300
  # Hermes 会过滤子进程环境变量，astra 的两个目录要显式放行
  env_passthrough:
    - ASTRA_HOME
    - ASTRA_MUSIC_DIR

skills:
  # astra 的 skill 从 astra/bin 一起挂进来，不和 Hermes 自己的 skills 混放
  external_dirs:
    - /opt/astra/skills
  # 注意：让 Hermes 能**写**这个目录的不是这里的键。
  # 写入白名单是环境变量 HERMES_WRITE_SAFE_ROOT（见 docker-compose.yml），
  # 在 config.yaml 里写 security.write_safe_roots 不会生效 —— 实测过，不存在这个键。

# 共享群聊里每人一份会话
group_sessions_per_user: true

# 官方镜像默认禁止按需装依赖（HERMES_DISABLE_LAZY_INSTALLS）；飞书适配器要 lark_oapi，允许一次
security:
  allow_lazy_installs: true

# ---- 上下文成本 ----
# 飞书是常驻会话，历史会一直涨。但**不必为此早压缩**：
# 实测 WorkBuddy2API 支持 prompt cache，第 2 次起命中 99.9%
# （4422 token 的请求，hit 4416 / miss 6）。重读历史不等于付全价。
#
# 阈值定在 40 万（1M 窗口的 40%）：既留得下长历史，又给单轮对话留足余量。
# 真正的成本尖峰只有换模型那一下 —— 缓存按模型 key，换了就整份失效。
compression:
  enabled: true
  threshold: 0.50
  # 40 万；不在这个数上卡死，"省 token"的收益远小于"丢掉有用历史"的损失
  threshold_tokens: 400000
  target_ratio: 0.20
  # 压缩摘要由主模型做（glm-5.3-flash 够快），不单独配 auxiliary
